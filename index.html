<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block5project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside class="rectangle">
    <header class="header">
        
        <div class="header__burger">
            <img src="images/burger.svg" alt="Бургер">
        </div>
        <div class="header__group">
            <img src="images/Group.svg" alt="лого">
        </div>
        <div class="header__search">
            <img src="images/search.svg" alt="поиск">
        </div>
    </header>
    <main class="main-menu">
     <ul class="main__list">
        <li class="main__list main__list--repair">Ремонт техники</li>
        <li>Услуги и сервисы</li>
        <li>Корпоративным клиентам</li>
        <li>Продавцам техники</li>
        <li>Партнерам</li>
        <li>Производителям</li>
        <li>Наши сервисные центры</li>
        <li>Контакты</li>
     </ul>
    </main>
     <footer class="main-block">
     <section class="contact">
        <div class="contact__profile">
            <img src="images/profile.svg" alt="профиль">
        </div>
        <div class="contact__chat">
            <img src="images/chat.svg" alt="чат">
        </div>
        <div class="contact__chat-copy">
            <img src="images/chat copy.svg" alt="телефон">
        </div>
     </section>
     <section class="contact-info">  
        <a class="contact__mail" href="#">mail@cps.com</a>
        <p class="contact__number">8 800 890 8900</p>
     </section>
    
     <section class="lang">
        <p class="grey">ru</p>
        <p>en</p>
        <p>ch</p>
     </section>
     </footer>
    
     </aside>
</body>
</html>
